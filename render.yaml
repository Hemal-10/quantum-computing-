services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: quantum-dna-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  # 2. React Vite Frontend (Static Site)
  - type: web
    name: quantum-dna-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://quantum-dna-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
